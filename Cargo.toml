[package]
name = "agyline"
version = "2.0.6"
edition = "2021"
description = "Fast, zero-dependency Cometix-style native Rust status line for Antigravity CLI"
license = "MIT"
repository = "https://github.com/TakiGuan/agyline"
readme = "README.md"
keywords = ["antigravity", "cli", "statusline", "terminal", "rust"]
categories = ["command-line-utilities"]

[[bin]]
name = "agyline"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"
